[build-system]
# setuptools compiles the optional Cython extensions declared in setup.py
requires = ["setuptools>=77", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iso8583sim"
version = "1.5.0"
description = "High-performance ISO 8583 message simulator with CLI, Python SDK, and LLM features"
readme = "README.md"
authors = [
    { name = "Subhadip Mitra", email = "contact@subhadipmitra.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Office/Business :: Financial",
]
keywords = ["iso8583", "payment", "banking", "financial", "simulator"]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=10.0.0",
    "typer>=0.4.0",
]
requires-python = ">=3.10"

[project.scripts]
iso8583sim = "iso8583sim.cli.commands:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.1",
    "coverage>=7.4.0",
    "pyyaml>=6.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.1",
    "coverage>=7.4.0",
    "pyyaml>=6.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=0.900",
    "ruff>=0.0.290",
    "pre-commit>=3.5.0",
    "cython>=3.0.0",
]
# MCP server for AI assistants
mcp = [
    "mcp>=2.0.0",
]
# PIN blocks and MACs
security = [
    "cryptography>=42.0.0",
]
# REST API server
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
perf = [
    "cython>=3.0.0",
]
# LLM providers for AI-powered features
llm = [
    "anthropic>=1.0.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "ollama>=0.4.0",
]
anthropic = [
    "anthropic>=1.0.0",
]
openai = [
    "openai>=1.50.0",
]
google = [
    "google-genai>=1.0.0",
]
ollama = [
    "ollama>=0.4.0",
]
# Tooling for generating the API reference in docs/ (scripts/generate_api_docs.py)
docs = [
    "griffe>=1.0",
]

[tool.setuptools.packages.find]
include = ["iso8583sim*"]

[tool.setuptools.package-data]
# Ship the Cython sources so the package can be rebuilt from an installed copy
"iso8583sim.core" = ["*.pyx"]

[tool.setuptools.exclude-package-data]
"iso8583sim.core" = ["*.c"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-win32", "*-*linux_i686"]
test-extras = ["test"]
# subhadipmitra@: importlib import mode stops pytest from putting the source tree on the path,
# so the tests exercise the installed wheel. ISO8583SIM_REQUIRE_CYTHON makes
# tests/test_compiled.py fail if the extensions didn't load.
test-command = "pytest {project}/tests -q -p no:cacheprovider --import-mode=importlib -o addopts=--capture=no -o log_cli=false"
test-environment = { ISO8583SIM_REQUIRE_CYTHON = "1" }

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--capture=no",
    "--strict-markers",
    "--tb=short",
    "--cov=iso8583sim",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--junitxml=test-results.xml",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests", "benchmarks"]
check_untyped_defs = true
disallow_untyped_defs = false
