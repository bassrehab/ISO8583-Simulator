name: Wheels

# subhadipmitra@: Builds compiled wheels for every supported platform and Python version, and
# tests each one against the installed wheel. Runs on PRs that touch the build, and is reused
# by the publish workflow so releases ship exactly what was tested.
on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - 'iso8583sim/**/*.pyx'
      - .github/workflows/wheels.yml
  workflow_call:
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  pure:
    name: Pure-Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        env:
          ISO8583SIM_PURE: '1'
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls dist/*-py3-none-any.whl

      # subhadipmitra@: Run from outside the checkout with importlib import mode, like
      # cibuildwheel, so the tests use the installed wheel and not the source tree.
      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$(ls $GITHUB_WORKSPACE/dist/*.whl)[test,mcp,llm,security,web]"
          python -c "import iso8583sim.core.parser as p; assert not p.__file__.endswith('.so')"
          python -m pytest $GITHUB_WORKSPACE/tests -q -p no:cacheprovider --import-mode=importlib -o addopts=--capture=no -o log_cli=false -m "not slow"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-pure
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
