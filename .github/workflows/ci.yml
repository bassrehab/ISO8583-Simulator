name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        pure: [false]
        include:
          # subhadipmitra@: The editable install compiles the Cython extensions, so also run
          # once with the compiler disabled to keep the pure-Python fallback tested.
          - python-version: '3.12'
            pure: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.pure }}" = "true" ]; then export CC=false; fi
          pip install -e ".[test,mcp,llm,security,web]"
          python -c "import iso8583sim.core.parser as p; print('Cython extensions:', p._USE_CYTHON)"

      - name: Run tests
        run: pytest --cov=iso8583sim --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && !matrix.pure
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # subhadipmitra@: Pin the linters so a new release can't break CI on its own.
          # An unpinned ruff started formatting Markdown code blocks and failed this job.
          # Keep these in step with .pre-commit-config.yaml when upgrading.
          pip install "ruff==0.14.10" "mypy==1.19.1"

      - name: Run ruff
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy iso8583sim

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # subhadipmitra@: Build the REST API image and hit /health on a running container, so a
      # broken Dockerfile fails CI instead of the first user who tries it.
      - name: Build image
        run: docker build -t iso8583sim:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 iso8583sim:ci
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
