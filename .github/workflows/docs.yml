name: Docs

# subhadipmitra@: The docs are published by Mintlify from the docs/ folder. This workflow only
# checks them: the generated API reference and OpenAPI spec must match the code, and the
# Mintlify build and links must be valid.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,web]"

      - name: Generated reference is up to date
        run: |
          python scripts/generate_api_docs.py --check
          python scripts/export_openapi.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mintlify build and links
        working-directory: docs
        run: |
          npx -y mint@latest validate
          npx -y mint@latest broken-links
